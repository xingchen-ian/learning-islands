<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

<body>
  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-emoji">💼</span>

        <h1 id="unitTitle">词汇冒险岛</h1>
        <p id="unitSubtitle">7A Unit 3 · 职业与工作 Jobs</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="progress-chip" id="progressChip">
        <span class="star">⭐</span>
        <span id="masteryText">已掌握 0 / 67</span>
      </div>
      <a class="home-btn" href="index.html" title="返回主站">🏠</a>
      <button class="voice-pick-btn" id="voicePickBtn" title="选择朗读音色">🎤</button>
    </div>
  </header>

  <!-- 单元切换 -->
  <nav class="unitnav">
    <a class="unit-btn" href="u1.html">📘 U1 · Trying new things</a>
    <a class="unit-btn" href="u2.html">💪 U2 · Strong mind</a>
    <a class="unit-btn" href="u3.html">☀️ 暑假List 1</a>
    <a class="unit-btn active" href="u4.html">💼 U3 · Jobs</a>
    <a class="unit-btn" href="u5.html">🏠 U4 · Smart home</a>
    <a class="unit-btn" href="u6.html">🎬 U5 · Films</a>
    <a class="unit-btn" href="u7.html">⛰️ U6 · Mountains</a>
    <a class="unit-btn" href="grammar.html">🧭 语法冒险岛</a>
    <a class="unit-btn" href="exam.html">🎯 考纲岛</a>
    <a class="unit-btn" href="backup.html">💾 进度备份</a>
  </nav>

  <!-- 云端同步条（未配置时自动隐藏） -->
  <div id="cloudBar" class="cloudbar" style="display:none"></div>

  <!-- 模式选择导航 -->
  <nav class="modenav" id="modeNav">
    <button class="mode-btn active" data-mode="cards">🃏<span>闪卡</span></button>
    <button class="mode-btn" data-mode="match">🔗<span>中英匹配</span></button>
    <button class="mode-btn" data-mode="forms">🔤<span>词性转换</span></button>
    <button class="mode-btn" data-mode="cloze">✏️<span>选词填空</span></button>
    <button class="mode-btn" data-mode="spell">⌨️<span>拼写练习</span></button>
    <button class="mode-btn" data-mode="sentence">💡<span>造句练习</span></button>
    <button class="mode-btn" data-mode="dictate">✍️<span>听写</span></button>
    <button class="mode-btn" data-mode="saved">⭐<span>收藏</span></button>
    <button class="mode-btn" data-mode="wrong">📒<span>错题本</span></button>
  </nav>

  <!-- 主内容区 -->
  <main id="main" class="main"></main>

  <!-- 底部激励条 -->
  <footer class="footer">
    <span id="footerTip">每天十分钟，词汇变轻松 🌟</span>
  </footer>

  <!-- 反馈气泡 -->
  <div id="toast" class="toast"></div>

  <!-- CloudBase JS SDK（固定 2.31.0，避免 latest 跳版本） -->
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.31.0/cloudbase.full.js"></script>
  <script src="voice.js"></script>
  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="data4.js"></script>
  <script src="verbs.js"></script>
  <script src="forms-bank.js?v=20260926a"></script>
  <script src="forms-pdf-bank.js"></script>
  <script src="app.js?v=20260927b"></script>
